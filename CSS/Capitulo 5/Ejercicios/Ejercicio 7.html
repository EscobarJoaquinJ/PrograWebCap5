<!DOCTYPE html>

<!-- Ejercicio 7 -->
<html>
   <head>
      <meta charset="utf-8">
      <title>Ejercicio 7</title>
      <style type="text/css">
         .caja {
            width: 50px;
            height: 50px;
            background-color: red;
            position: relative;
            animation: moverCuadrado 4s infinite linear;
         }

         @keyframes moverCuadrado {
            0%   { top: 0px;   left: 0px; }
            25%  { top: 0px;   left: 100px; }
            50%  { top: 100px; left: 100px; }
            75%  { top: 100px; left: 0px; }
            100% { top: 0px;   left: 0px; }
         }
      </style>
   </head>
   <body>
      <a href="../Indices/IndiceC5.html">Ir a la página principal</a>
      <hr>
      
      <div class="caja"></div>
   </body>
</html>
