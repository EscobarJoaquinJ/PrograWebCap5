<!DOCTYPE html>

<!-- Ejercicio 5 -->
<html>
  <head>
    <meta charset="utf-8">
    <title>Ejercicio 5</title>
    <style type="text/css">
      /* Estilos para el elemento header */
      header {
        background-color: #add8e6; /* Color de fondo azul claro */
        border: 2px solid #00008b; /* Borde azul oscuro */
        padding: 20px;
        text-align: center;
        margin-bottom: 15px; /* Separación con los párrafos */
      }

      /* Estilos generales para las columnas (párrafos) */
      .columna {
        float: left; /* Alinea los elementos uno al lado del otro */
        width: 48%; /* Asigna un ancho para que quepan ambas columnas */
        padding: 15px;
        box-sizing: border-box; /* Asegura que el padding no aumente el ancho total */
      }

      /* Estilos específicos para el primer párrafo */
      .columna-1 {
        background-color: #90ee90; /* Color de fondo verde claro */
        border: 2px solid #006400; /* Borde verde oscuro */
        margin-right: 4%; /* Espacio de separación entre las dos columnas */
      }

      /* Estilos específicos para el segundo párrafo */
      .columna-2 {
        background-color: #ffb6c1; /* Color de fondo rosa claro */
        border: 2px solid #8b0000; /* Borde rojo oscuro */
      }
    </style>
  </head>
  <body>
    <a href="../Indices/IndiceC4.html">Ir a la pagina principal</a>
    <hr>
    
    <header>
      <h1>Encabezado de la Plantilla</h1>
    </header>

    <p class="columna columna-1">
      Parrafo prueba. Propiedad <code>float: left;</code> como la columna izquierda de la psgina.
    </p>

    <p class="columna columna-2">
      Parrafo prueba. Propiedad <code>float: left;</code>, se alinea automaticamente a la derecha del primer parrafo.
    </p>

  </body>
</html>
